[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "webgl",
    "web-colors",
    "crisp",
    "fira-sans",
] }
wasm-bindgen = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
opt-level = "s"
strip = "debuginfo"
